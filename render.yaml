services:
  - type: web
    name: mesa-ayuda
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SUPPORT
        sync: false
      - key: MAIL_RRHH
        sync: false
      - key: MAIL_FINANZAS
        sync: false
      - key: MAIL_LOGISTICA
        sync: false
      - key: MAIL_GENERAL
        sync: false
